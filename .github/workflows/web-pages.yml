# Frontend AMS: test + build setiap perubahan, deploy mode demo ke GitHub Pages.
# Mode demo = data contoh & business rule berjalan di browser (tanpa API/DB); untuk review user.
# Menggantikan jekyll-gh-pages.yml (yang mempublikasikan seluruh isi repo termasuk dokumen internal).
name: Web (Pages demo)

on:
  push:
    branches: [main, claude/nifty-bell-m0g9wp]
    paths: ["frontend/**", ".github/workflows/web-pages.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit test business rule (BR-01–BR-08, TC-01–TC-09)
        run: npm test
      - name: Typecheck & build (mode demo)
        run: npm run build
        env:
          VITE_API_MODE: demo
          VITE_AUTH_MODE: mock
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
